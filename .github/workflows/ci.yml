name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  shared-tests:
    name: shared-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/shared

  server-tests:
    name: server-tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Create and migrate test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE grandtour_test'
          cd server && DATABASE_URL=postgres://postgres:postgres@localhost:5432/grandtour_test bun run db/migrate.ts
      - run: bun test
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/grandtour_test

  admin-build:
    name: admin-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --filter @grandtour/admin build

  ios-build:
    name: ios-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/GrandTour.xcodeproj \
            -scheme GrandTour \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40

  ios-tests:
    name: ios-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Run logic tests on an available iPhone simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project ios/GrandTour.xcodeproj \
            -scheme GrandTourTests \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E 'Test Suite|Executed|error:|\*\* TEST' | tail -40

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .
