services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grandtour
    ports:
      - "5432:5432"
    volumes:
      - grandtour_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grandtour"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  grandtour_pg:
